<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Image</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 60px 20px; }
    .container { background: #fff; padding: 32px; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 100%; max-width: 460px; }
    h1 { font-size: 1.4rem; margin-bottom: 20px; text-align: center; color: #333; }
    label { display: block; margin-bottom: 6px; font-weight: bold; color: #555; }
    input[type="file"] { width: 100%; padding: 10px; margin-bottom: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; background: #4a90d9; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #357ab8; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    #response { margin-top: 20px; padding: 14px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; word-break: break-word; display: none; }
    .success { background: #e6f9e6; border: 1px solid #4caf50; color: #2e7d32; }
    .error { background: #fdecea; border: 1px solid #f44336; color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upload Image</h1>
    <form id="uploadForm" action="http://localhost:5000/upload" method="POST" enctype="multipart/form-data">
      <label for="image">Choose an image</label>
      <input type="file" id="image" name="image" accept="image/*" required>
      <button type="submit" id="btn">Upload</button>
    </form>
    <div id="response"></div>
  </div>

  <script>
    const form = document.getElementById('uploadForm');
    const responseDiv = document.getElementById('response');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      responseDiv.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Uploading…';

      try {
        const formData = new FormData(form);
        const res = await fetch('http://localhost:5000/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        responseDiv.textContent = JSON.stringify(data, null, 2);
        responseDiv.className = data.success ? 'success' : 'error';
      } catch (err) {
        responseDiv.textContent = 'Error: ' + err.message;
        responseDiv.className = 'error';
      }

      responseDiv.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Upload';
    });
  </script>
</body>
</html>
